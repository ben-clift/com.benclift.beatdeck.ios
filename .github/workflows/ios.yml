name: iPhone build (experimental)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install Flutter
        run: |
          set -euo pipefail
          rev=$(sed -n -E 's/.*revision: "(.*)"/\1/p' .metadata | head -n1)
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$HOME/flutter"
          git -C "$HOME/flutter" fetch --depth 1 origin "$rev"
          git -C "$HOME/flutter" checkout --force FETCH_HEAD
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"

      - name: Build the DJ engine for iPhone
        run: |
          set -euo pipefail
          set +e
          cmake -S native/ios -B build/ios-engine \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.5 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > cmake-config.txt 2>&1
          if [ "$?" != "0" ]; then
            echo "::error title=cmake configure failed::$(tail -n 30 cmake-config.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
            exit 1
          fi
          set -e
          set +e
          cmake --build build/ios-engine --parallel 4 > engine-build.txt 2>&1
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            grep -E 'error:|Error |undefined symbol|fatal' -B1 -A3 engine-build.txt | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' > errs.txt
            echo "::error title=engine build failed::$(cat errs.txt)"
            exit 1
          fi
          libs=$(find build/ios-engine -name '*.a')
          echo "$libs"
          mkdir -p native/ios_plugin/ios/libs
          libtool -static -o native/ios_plugin/ios/libs/libdj_engine_all.a $libs
          ls -la native/ios_plugin/ios/libs

      - name: List the engine functions dart:ffi looks up
        run: |
          set -euo pipefail
          names=$( (grep -ohE "\bdj_[a-z_0-9]+" native/engine/dj_engine.h; grep -rohE "'dj_[a-z_0-9]+'" lib | tr -d "'") | sort -u)
          out=native/ios_plugin/ios/Classes/dj_keep.c
          {
            echo "// Generated in CI: references every engine function so the linker keeps them."
            for n in $names; do echo "extern void $n(void);"; done
            echo "__attribute__((used)) void* const dj_keep_table[] = {"
            for n in $names; do echo "  (void*)$n,"; done
            echo "  0 };"
          } > "$out"
          echo "$names" | wc -l

      - name: Create the iPhone project
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter create --platforms=ios --org com.benclift --project-name sidedeck .
          flutter pub add dj_engine_ios --path native/ios_plugin
          # Bundle id, minimum iOS, background audio and permission texts.
          sed -i '' 's/com\.benclift\.sidedeck/com.benclift.beatdeck.ios/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/^# platform :ios, .*/platform :ios, '15.5'/" ios/Podfile
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName BeatDeck" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string To read playlist screenshots you choose." $P || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true

      - name: Build the app (unsigned)
        run: |
          set -euo pipefail
          flutter pub get
          set +e
          flutter build ios --release --no-codesign --build-name=1.2.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_EPOCH=$(date +%s) > ios-build.txt 2>&1
          code=$?
          if [ "$code" != "0" ]; then
            grep -E 'error:|Error|error •|Undefined symbol|ld:|FAILURE|failed' -B1 -A3 ios-build.txt | head -70 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' > errs.txt
            echo "::error title=iPhone app build failed::$(cat errs.txt)"
            exit 1
          fi

      - name: Check the engine is inside the app
        run: |
          BIN=build/ios/iphoneos/Runner.app/Frameworks/dj_engine_ios.framework/dj_engine_ios
          {
            echo "files: $(ls build/ios/iphoneos/Runner.app | tr '\n' ' ')"
            echo "frameworks: $(ls build/ios/iphoneos/Runner.app/Frameworks 2>/dev/null | tr '\n' ' ')"
            echo "runner symbols (global): $(nm -gU "$BIN" 2>&1 | wc -l); any dj_: $(nm "$BIN" 2>&1 | grep -ci dj_ || true); plugin: $(nm "$BIN" 2>&1 | grep -ci DjEngineIos || true)"
            echo "dj sample: $(nm "$BIN" 2>&1 | grep -i dj_ | head -3 | tr '\n' ' ')"
            echo "libs: $(ls -la native/ios_plugin/ios/libs | tr '\n' ' ')"
            echo "keep: $(wc -l < native/ios_plugin/ios/Classes/dj_keep.c)"
          } > diag.txt
          echo "::notice title=diagnostics::$(cat diag.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          n=$(nm -gU "$BIN" | grep -c ' _dj_' || true)
          echo "engine functions exported: $n"
          if [ "$n" -lt 20 ]; then
            echo "::error title=engine missing from the app::only $n dj_ symbols are visible, so dart:ffi could not find the engine"
            exit 1
          fi
          echo "::notice title=engine linked::$n engine functions are exported by the app"

      - name: Sign and upload to TestFlight (only when the Apple secrets are set)
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$CERT" ] || [ -z "$PROFILE" ] || [ -z "$KEY_P8" ]; then
            echo "::notice title=TestFlight skipped::Apple secrets are not set yet (see IOS_SETUP.md)"
            exit 0
          fi
          set -euo pipefail
          KC=$RUNNER_TEMP/build.keychain
          security create-keychain -p tmp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmp "$KC"
          echo "$CERT" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k tmp "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > $RUNNER_TEMP/p.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/p.mobileprovision)")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/p.mobileprovision)")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/p.mobileprovision)")
          cp $RUNNER_TEMP/p.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.benclift.beatdeck.ios</key><string>$NAME</string></dict>
          </dict></plist>
          PL
          flutter build ipa --release --build-name=1.2.${{ github.run_number }} --build-number=${{ github.run_number }} \
            --dart-define=BUILD_EPOCH=$(date +%s) --export-options-plist=$RUNNER_TEMP/export.plist
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "::notice title=TestFlight::uploaded build 1.2.${{ github.run_number }}"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            engine-build.txt
            ios-build.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: beatdeck-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
